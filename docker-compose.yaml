services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: courtiq
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: courtiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - custom_net

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: you@example.com
      PGADMIN_DEFAULT_PASSWORD: yourpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - custom_net

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://courtiq:yourpassword@postgres:5432/courtiq
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - custom_net
  
  angular:
    build: ./frontend
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks:
      - custom_net

volumes:
  pgdata:

networks:
  custom_net:
    driver: bridge