services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: courtiq
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: courtiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - custom_net

volumes:
  pgdata:

networks:
 - custom_net
